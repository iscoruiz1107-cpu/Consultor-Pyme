<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Consultor Estratégico · Agente IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14161b;
    --panel: #1c1f26;
    --panel-2: #23262f;
    --line: #33363f;
    --ink: #ece7de;
    --ink-dim: #9a9ca3;
    --brass: #b6905a;
    --brass-dim: #7c6540;
    --user-bubble: #2b2f39;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
  }

  header {
    position: relative;
    padding: 28px 32px 22px;
    border-bottom: 1px solid var(--line);
    overflow: hidden;
    flex-shrink: 0;
  }
  header::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(182,144,90,0.08), transparent 60%);
    pointer-events: none;
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--brass);
    margin: 0 0 6px;
    font-weight: 600;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 26px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .subtitle {
    color: var(--ink-dim);
    font-size: 13.5px;
    margin-top: 6px;
    max-width: 560px;
    line-height: 1.5;
  }
  .trendline {
    position: absolute;
    right: 24px;
    top: 18px;
    width: 130px;
    height: 48px;
    opacity: 0.55;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 28px 20px 10px;
    display: flex;
    justify-content: center;
  }
  #thread {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    max-width: 84%;
    padding: 13px 16px;
    border-radius: 3px;
    font-size: 14.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    animation: rise 0.25s ease-out;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border: 1px solid var(--line);
  }
  .msg.model {
    align-self: flex-start;
    background: transparent;
    border-left: 2px solid var(--brass-dim);
    padding-left: 16px;
    border-radius: 0;
  }
  .msg.model .label {
    display: block;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .msg.typing {
    color: var(--ink-dim);
    font-style: italic;
    font-size: 13px;
  }
  .msg.error {
    align-self: center;
    color: #d98a7a;
    background: #2a1e1c;
    border: 1px solid #4a2c26;
    font-size: 13px;
  }

  footer {
    flex-shrink: 0;
    border-top: 1px solid var(--line);
    padding: 16px 20px 20px;
    display: flex;
    justify-content: center;
    background: var(--bg);
  }
  form {
    width: 100%;
    max-width: 720px;
    display: flex;
    gap: 10px;
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 12px 14px;
    line-height: 1.5;
    max-height: 140px;
  }
  textarea:focus {
    outline: none;
    border-color: var(--brass-dim);
  }
  button {
    background: var(--brass);
    color: #1a1508;
    border: none;
    border-radius: 3px;
    padding: 0 22px;
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: #c8a06a; }
  button:disabled {
    background: var(--panel-2);
    color: var(--ink-dim);
    cursor: not-allowed;
  }
  button:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .msg { animation: none; }
  }
  @media (max-width: 560px) {
    header { padding: 22px 18px 18px; }
    .trendline { display: none; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Sesión de asesoría · en vivo</p>
  <h1>Consultor Estratégico</h1>
  <p class="subtitle">Asesor en gestión empresarial: estrategia, estructura, finanzas de negocio y operaciones. Contame tu situación y lo pensamos juntos.</p>
  <svg class="trendline" viewBox="0 0 130 48" fill="none">
    <polyline points="2,40 22,30 40,34 58,18 76,22 94,8 112,12 128,4"
      stroke="#b6905a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="128" cy="4" r="3" fill="#b6905a"/>
  </svg>
</header>

<main>
  <div id="thread"></div>
</main>

<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Planteá tu consulta de negocio…" autofocus></textarea>
    <button type="submit" id="send">Enviar</button>
  </form>
</footer>

<script>
  const thread = document.getElementById('thread');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  let history = [];

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    if (role === 'model') {
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = 'Consultor';
      div.appendChild(label);
      div.appendChild(document.createTextNode(text));
    } else {
      div.textContent = text;
    }
    thread.appendChild(div);
    div.scrollIntoView({ behavior: 'smooth', block: 'end' });
    return div;
  }

  function autosize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  }
  input.addEventListener('input', autosize);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage('user', text);
    history.push({ role: 'user', text });
    input.value = '';
    autosize();
    sendBtn.disabled = true;

    const typingEl = addMessage('typing', 'Analizando tu consulta…');
    typingEl.classList.add('typing');

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ history }),
      });
      const data = await res.json();
      typingEl.remove();

      if (!res.ok) {
        addMessage('error', data.error || 'Ocurrió un error. Probá de nuevo.');
      } else {
        addMessage('model', data.reply);
        history.push({ role: 'model', text: data.reply });
      }
    } catch (err) {
      typingEl.remove();
      addMessage('error', 'No se pudo conectar con el servidor.');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  form.addEventListener('keydown', (e) => {});
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  addMessage('model', 'Buen día. Contame en qué etapa está tu negocio y qué decisión o problema tenés sobre la mesa — arrancamos por ahí.');
</script>

</body>
</html>
