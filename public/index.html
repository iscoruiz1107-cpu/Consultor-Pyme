<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Consultor Estratégico · Agente IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
<style>
  :root {
    --bg: #14161b;
    --panel: #1c1f26;
    --panel-2: #23262f;
    --line: #33363f;
    --ink: #ece7de;
    --ink-dim: #9a9ca3;
    --brass: #b6905a;
    --brass-dim: #7c6540;
    --brass-soft: rgba(182,144,90,0.14);
    --user-bubble: #2b2f39;
    --green: #7a9b7a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }
  body { display: flex; flex-direction: column; }

  header {
    position: relative;
    padding: 24px 32px 20px;
    border-bottom: 1px solid var(--line);
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }
  header::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(182,144,90,0.08), transparent 60%);
    pointer-events: none;
  }
  .header-left { position: relative; z-index: 1; }
  .brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .mark {
    width: 22px; height: 22px; flex-shrink: 0;
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--brass);
    margin: 0;
    font-weight: 600;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 25px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .subtitle {
    color: var(--ink-dim);
    font-size: 13.5px;
    margin-top: 6px;
    max-width: 560px;
    line-height: 1.5;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--green);
    background: rgba(122,155,122,0.12);
    border: 1px solid rgba(122,155,122,0.3);
    padding: 3px 9px 3px 7px;
    border-radius: 20px;
    margin-top: 10px;
    font-weight: 500;
  }
  .badge .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
  }
  .header-right {
    position: relative; z-index: 1;
    flex-shrink: 0;
  }
  .new-chat-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-size: 12.5px;
    padding: 8px 14px;
    border-radius: 3px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    white-space: nowrap;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .new-chat-btn:hover { border-color: var(--brass-dim); color: var(--ink); }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 28px 20px 10px;
    display: flex;
    justify-content: center;
  }
  #thread {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    max-width: 84%;
    padding: 13px 16px;
    border-radius: 3px;
    font-size: 14.5px;
    line-height: 1.65;
    animation: rise 0.25s ease-out;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border: 1px solid var(--line);
    white-space: pre-wrap;
  }
  .msg.model {
    align-self: flex-start;
    background: transparent;
    border-left: 2px solid var(--brass-dim);
    padding-left: 16px;
    border-radius: 0;
    max-width: 92%;
  }
  .msg.model .label {
    display: block;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 8px;
    font-weight: 600;
  }
  /* Markdown rendering dentro de la respuesta del modelo */
  .msg.model .body { }
  .msg.model .body p { margin: 0 0 10px; }
  .msg.model .body p:last-child { margin-bottom: 0; }
  .msg.model .body ul, .msg.model .body ol { margin: 0 0 10px; padding-left: 20px; }
  .msg.model .body li { margin-bottom: 4px; }
  .msg.model .body strong { color: #fff; font-weight: 600; }
  .msg.model .body h1, .msg.model .body h2, .msg.model .body h3 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    color: var(--ink);
    margin: 16px 0 8px;
    font-size: 16px;
  }
  .msg.model .body h1:first-child, .msg.model .body h2:first-child, .msg.model .body h3:first-child { margin-top: 0; }
  .msg.model .body code {
    background: var(--panel-2);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 13px;
  }
  .msg.model .body a { color: var(--brass); }
  .msg.model .body blockquote {
    margin: 0 0 10px;
    padding-left: 12px;
    border-left: 2px solid var(--line);
    color: var(--ink-dim);
  }

  .sources {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .sources .sources-label {
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-right: 4px;
  }
  .source-chip {
    font-size: 11.5px;
    color: var(--ink-dim);
    background: var(--panel-2);
    border: 1px solid var(--line);
    padding: 3px 9px;
    border-radius: 20px;
    text-decoration: none;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .source-chip:hover { border-color: var(--brass-dim); color: var(--ink); }

  .msg.typing {
    color: var(--ink-dim);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .typing-dots { display: inline-flex; gap: 3px; }
  .typing-dots span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--brass);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-3px); }
  }

  .msg.error {
    align-self: center;
    color: #d98a7a;
    background: #2a1e1c;
    border: 1px solid #4a2c26;
    font-size: 13px;
  }

  footer {
    flex-shrink: 0;
    border-top: 1px solid var(--line);
    padding: 16px 20px 20px;
    display: flex;
    justify-content: center;
    background: var(--bg);
  }
  form {
    width: 100%;
    max-width: 720px;
    display: flex;
    gap: 10px;
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 12px 14px;
    line-height: 1.5;
    max-height: 140px;
  }
  textarea:focus { outline: none; border-color: var(--brass-dim); }
  button.send-btn {
    background: var(--brass);
    color: #1a1508;
    border: none;
    border-radius: 3px;
    padding: 0 22px;
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button.send-btn:hover { background: #c8a06a; }
  button.send-btn:disabled { background: var(--panel-2); color: var(--ink-dim); cursor: not-allowed; }
  button:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .msg { animation: none; }
    .typing-dots span { animation: none; }
  }
  @media (max-width: 560px) {
    header { padding: 20px 18px 16px; flex-direction: column; }
    h1 { font-size: 21px; }
    .msg.model { max-width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="brand-row">
      <svg class="mark" viewBox="0 0 22 22" fill="none">
        <circle cx="11" cy="11" r="10" stroke="#b6905a" stroke-width="1.4"/>
        <polyline points="6,13 9.5,9.5 12,12 16,7" stroke="#b6905a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p class="eyebrow">Sesión de asesoría · en vivo</p>
    </div>
    <h1>Consultor Estratégico</h1>
    <p class="subtitle">Asesor en gestión empresarial: estrategia, estructura, finanzas de negocio, financiamiento y operaciones.</p>
    <span class="badge"><span class="dot"></span>Con acceso a la web · fuentes verificables</span>
  </div>
  <div class="header-right">
    <button class="new-chat-btn" id="newChat">+ Nueva conversación</button>
  </div>
</header>

<main>
  <div id="thread"></div>
</main>

<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Planteá tu consulta de negocio…" autofocus></textarea>
    <button type="submit" class="send-btn" id="send">Enviar</button>
  </form>
</footer>

<script>
  const thread = document.getElementById('thread');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const newChatBtn = document.getElementById('newChat');

  const STORAGE_KEY = 'consultor-chat-history';
  const WELCOME = 'Buen día. Contame en qué etapa está tu negocio y qué decisión o problema tenés sobre la mesa — arrancamos por ahí.';

  let history = [];

  function renderModelBody(text) {
    const rawHtml = marked.parse(text, { breaks: true });
    return DOMPurify.sanitize(rawHtml);
  }

  function addMessage(role, text, sources) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;

    if (role === 'model') {
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = 'Consultor';
      div.appendChild(label);

      const body = document.createElement('div');
      body.className = 'body';
      body.innerHTML = renderModelBody(text);
      div.appendChild(body);

      if (sources && sources.length) {
        const src = document.createElement('div');
        src.className = 'sources';
        const lbl = document.createElement('span');
        lbl.className = 'sources-label';
        lbl.textContent = 'Fuentes';
        src.appendChild(lbl);
        sources.slice(0, 6).forEach(s => {
          const a = document.createElement('a');
          a.href = s.uri;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.className = 'source-chip';
          a.textContent = s.title || s.uri;
          src.appendChild(a);
        });
        div.appendChild(src);
      }
    } else {
      div.textContent = text;
    }

    thread.appendChild(div);
    div.scrollIntoView({ behavior: 'smooth', block: 'end' });
    return div;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'msg typing';
    div.innerHTML = 'Buscando y analizando <span class="typing-dots"><span></span><span></span><span></span></span>';
    thread.appendChild(div);
    div.scrollIntoView({ behavior: 'smooth', block: 'end' });
    return div;
  }

  function saveHistory() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch (e) {}
  }

  function startNewChat() {
    history = [];
    thread.innerHTML = '';
    addMessage('model', WELCOME);
    saveHistory();
    input.focus();
  }
  newChatBtn.addEventListener('click', startNewChat);

  function autosize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  }
  input.addEventListener('input', autosize);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage('user', text);
    history.push({ role: 'user', text });
    saveHistory();
    input.value = '';
    autosize();
    sendBtn.disabled = true;

    const typingEl = addTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ history }),
      });
      const data = await res.json();
      typingEl.remove();

      if (!res.ok) {
        addMessage('error', data.error || 'Ocurrió un error. Probá de nuevo.');
      } else {
        addMessage('model', data.reply, data.sources);
        history.push({ role: 'model', text: data.reply });
        saveHistory();
      }
    } catch (err) {
      typingEl.remove();
      addMessage('error', 'No se pudo conectar con el servidor.');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  // Restaurar conversación previa si existe, si no, mostrar bienvenida
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    if (Array.isArray(saved) && saved.length) {
      history = saved;
      saved.forEach(m => addMessage(m.role === 'user' ? 'user' : 'model', m.text));
    } else {
      addMessage('model', WELCOME);
    }
  } catch (e) {
    addMessage('model', WELCOME);
  }
</script>

</body>
</html>
